[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-pointers"
version = "1.0.0.dev0"
description = "Neurodynamical models of neural pointers, competitive queueing and progress monitoring for sequencing visual-mental operations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Schmid", email = "daniel-1.schmid@uni-ulm.de" }]
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omegaconf>=2.3,<2.4",
    "scipy>=1.10",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["black>=24", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["neural_pointers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
