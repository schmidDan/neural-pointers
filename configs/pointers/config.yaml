# Synaptic pointer experiment: six items are bound to six pointers and read out serially afterwards.
# The defaults reproduce the simulation of the BonnBrain 2024 poster.
defaults:
  - model: default
  - simulation: default
  - _self_

seed: 42
n_neurons: 6
plot: true

hydra:
  run:
    dir: outputs/pointers/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/pointers/${now:%Y-%m-%d}/${now:%H-%M-%S}
