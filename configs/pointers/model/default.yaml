# Parameters of the SynapticPointerModel, following the model equations shown on the poster: shunting excitation and
# inhibition, purely synaptic pointer weights and pointer neurons with their own dynamics. The structure used for the
# poster simulations is available as `model=poster_simulation`. Both operation modes (binding and WTA read-out) share
# `common_params` unless overridden.

# Structure of the model, see SynapticPointerModel.
variant:
  excitation: shunting # additive | shunting
  inhibition: shunting # subtractive | shunting
  pointer_weights: synaptic # offset (1 + s) | synaptic (s)
  pointer_dynamics: true # pointers as neurons integrating the pointer input
pointer_params:
  tau: 0.2 # time constant of the pointer neurons; they must decay within the 2 time-unit resets between stages

common_params:
  neuron_params:
    alpha: 0.0
    beta: 1.0
    delta: 0.1
    gamma: 1.0 # shunting part of the inhibition
    tau: 1.0
  syn_params:
    syn_min: 0.0
    syn_max: 1.0
    tau_rise: 1.0
    tau_decay: 200.0

binding_params:
  neuron_params:
    eta: 1.0
    alpha: ${...common_params.neuron_params.alpha}
    beta: ${...common_params.neuron_params.beta}
    delta: ${...common_params.neuron_params.delta}
    gamma: ${...common_params.neuron_params.gamma}
    tau: ${...common_params.neuron_params.tau}
  syn_params:
    syn_min: ${...common_params.syn_params.syn_min}
    syn_max: ${...common_params.syn_params.syn_max}
    tau_rise: ${...common_params.syn_params.tau_rise}
    tau_decay: ${...common_params.syn_params.tau_decay}
  connection_params:
    kappa: 0.0
    k_inh: 0.0

WTA_params:
  neuron_params:
    eta: 10.0 # strong pooled inhibition for winner-take-all with bounded potentials
    alpha: ${...common_params.neuron_params.alpha}
    beta: ${...common_params.neuron_params.beta}
    delta: 10.0 # strong pointer modulation during read-out
    gamma: ${...common_params.neuron_params.gamma}
    tau: ${...common_params.neuron_params.tau}
  syn_params:
    syn_min: ${...common_params.syn_params.syn_min}
    syn_max: ${...common_params.syn_params.syn_max}
    tau_rise: .inf # no Hebbian growth during read-out; pointers are formed during binding only
    tau_decay: ${...common_params.syn_params.tau_decay}
  connection_params:
    kappa: 1.0 # no self-inhibition
    k_inh: 1.0 # pooled inhibition (winner-take-all)
