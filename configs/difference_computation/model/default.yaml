# Parameters of the DifferenceComputationModel.
n_inputs_per_neuron: 7
weight_seed: 132 # seed of the random recurrent weights of the input layer
neuron_params:
  # difference neurons
  alpha: 0.0
  beta: 1.0
  eta: 1.0
  gamma: 0.0
  tau: 1.0
  # prediction neurons
  alpha_i: 0.0
  beta_i: 1.0
  tau_i: 1.0
  # input neurons (alpha_inp, beta_inp and tau_inp are shared with the inhibitory input neurons)
  alpha_inp: 0.1
  beta_inp: 1.0
  lambda_inp: 0.3 # strength of recurrent excitation
  gamma_inp: 1.0
  eta_inp: 1.0
  tau_inp: 5.0
  # evidence neurons
  alpha_evdc: 0.5
  beta_evdc: 1.0
  tau_evdc: 10.0
  thresh_evdc: 0.6
