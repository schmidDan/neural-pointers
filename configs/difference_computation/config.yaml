# Difference computation experiment: a sequence of input patterns is presented and the evidence neuron signals when
# the input representation has settled. The defaults reproduce the simulation of the BonnBrain 2024 poster.
defaults:
  - model: default
  - simulation: default
  - _self_

seed: 42
n_neurons: 1 # only 1 is supported
plot: true

hydra:
  run:
    dir: outputs/difference_computation/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/difference_computation/${now:%Y-%m-%d}/${now:%H-%M-%S}
